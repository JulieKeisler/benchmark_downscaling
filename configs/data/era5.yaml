# ERA5 download configuration (Copernicus Climate Data Store).
#
# Two sources:
#  - "derived-era5-single-levels-daily-statistics": daily statistics computed
#    server-side. Cost limit (per the /costing API): 400 variable-days per
#    request — one variable x one year (365) is the largest selection that
#    fits, so requests are one variable per year.
#  - "reanalysis-era5-single-levels" (hourly): used for wind only, because
#    the daily-statistics dataset has no wind-speed variable (only u/v
#    components). Hourly u/v are downloaded and wind speed daily statistics
#    are computed locally. Cost limit 121,000: u+v for one year costs
#    ~105,120, so one year per request here too.
#
# To add a daily-statistics variable: add `short_name: era5_name` under the
# statistic you want (era5 names are listed on the CDS dataset page).
# To change the area: edit `area` = [North, West, South, East] in degrees.
#
# WARNING (ECMWF known issue, June 2026): do NOT use the
# "*_since_previous_post_processing" parameters (max/min 2m temperature,
# 10m wind gust, max/min total precipitation rate) — their data is wrong
# until ECMWF releases a fix. The download script refuses them.

output_dir: data/raw/era5

# France: North, West, South, East
area: [55.0, -6.0, 41.0, 10.0]

years:
  start: 1960
  end: 2020
daily_statistics:
  daily_mean:
    tas: 2m_temperature
    pr: total_precipitation       # mean of hourly accumulations (m); mm/day = value * 24 * 1000
    rsds: surface_solar_radiation_downwards  # mean of hourly accumulations (J m-2); W m-2 = value / 3600
    psl: mean_sea_level_pressure

hourly_wind:
  enabled: true
  years_per_request: 1
  keep_hourly: false   # delete the raw hourly chunk after aggregation (~250 MB/year)
api_key: 6bd5bb05-4ff6-4bb6-84a0-85257c2c3093