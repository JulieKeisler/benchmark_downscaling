# CMIP6 download configuration (Copernicus Climate Data Store,
# "projections-cmip6" dataset, daily temporal resolution).
#
# 1960-2014 comes from the `historical` experiment; 2015 onwards from the
# scenario below (scenarios barely diverge before ~2030, so the choice has
# little impact on 2015-2020).
#
# To add a GCM: add its CDS model id under `models` (the dataset page on
# https://cds.climate.copernicus.eu lists valid ids). Not every model
# provides every variable at daily resolution — the script reports what
# failed and continues.
# To add a variable: add a CMIP6 short name under `variables` and its CDS
# long name in the script's CDS_VARIABLES mapping (scripts/download_cmip6.py).
# To change the area: edit `area` = [North, West, South, East] in degrees.

output_dir: data/raw/cmip6

# France: North, West, South, East.
# NOTE: CDS CMIP6 uses 0-360 lon convention internally. Area [-6,10] returns only
# model points with lon >= 0 (e.g. IPSL: 0, 2.5, 5, 7.5, 10). The western
# ERA5 domain (-6 to 0) is covered by extrapolation in the evaluation script.
area: [55.0, -6.0, 41.0, 10.0]

years:
  start: 1960
  end: 2100

scenario: ssp585

models:
  - ipsl_cm6a_lr   # IPSL-CM6A-LR
  - cnrm_cm6_1     # CNRM-CM6-1
  - cesm2          # CESM2

# CMIP6 short names (mapped to CDS long names in the script):
# tas: near-surface air temperature        sfcWind: near-surface wind speed
# sfcWindmax: daily max near-surface wind  pr: precipitation
# rsds: downwelling shortwave radiation    psl: sea level pressure
variables:
  - tas
  - sfcWind
  - sfcWindmax
  - pr
  - rsds
  - psl

# ESGF ensemble member IDs (used by download_cmip6_esgf.py).
# CNRM-CM6-1 uses f2 physics; CESM2 ssp585 auto-detects r4i1p1f1 (no r1i1p1f1 available).
members:
  ipsl_cm6a_lr: r1i1p1f1
  cnrm_cm6_1: r1i1p1f2
  cesm2: r1i1p1f1
