# Default hyperparameters for each baseline method.
# These document what values the inference scripts use by default.
# Override at the command line: --stroke-time 3.0 --n-members 5

bicubic: {}   # stateless — no hyperparameters

bcsd: {}      # stateless — fits distribution per month/cell at inference time

cdft: {}      # stateless — bicubic upsample then per-cell monthly QM at ERA5 resolution

dotc:
  win_size: 20       # sliding window size for temporal trend estimation (years)
  step: 10           # sliding window step (years)
  trim: 5            # sliding window trim margin (years)

idownscale:   # CERFACS U-Net perfect-prognosis downscaling (Soares et al. 2024)
  epochs: 30       # U-Net training epochs
  batch_size: 32   # training batch size
  # At inference: per-variable CDF-t is applied at the coarse GCM resolution
  # (vs ERA5 coarsened) before bicubic upsampling to the ERA5 fine grid.

consistency:
  stroke_time: 5.0   # PSD-calibrated t* (Hess et al.); higher = more stochastic
  n_members: 1       # stochastic draws to average (trade speed for diversity)
  batch_size: 16     # inference batch size; reduce if GPU OOM

corrdiff_qm:
  n_members: 10      # stochastic residual-diffusion draws averaged per field
  sample_steps: 50   # strided DDPM reverse steps (few-step sampling)
  epochs: 5          # training epochs on ERA5 (both stages)
  batch_size: 16     # training batch size
  # Inference: QM maps GCM coarse predictor → ERA5 coarse predictor (per cell,
  # per calendar month), calibrated on the historical holdout only.
