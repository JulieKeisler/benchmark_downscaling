# CMIP6 download configuration (Copernicus Climate Data Store / ESGF),
# France region — historical + configured scenario. Kept as the historical
# default referenced by HPC job scripts on jz/cleps.
#
# 1960-2014 comes from the `historical` experiment; 2015 onwards from the
# scenario(s) below (scenarios barely diverge before ~2030).
#
# To add a GCM: add its CDS model id under `models`. Not every model
# provides every variable at daily resolution — the script reports what
# failed and continues.
# To change the area: edit `area` = [North, West, South, East] in degrees.
#
# NOTE: `psl` and `sfcWindmax` are NOT published on CDS for IPSL-CM6A-LR —
# use download_cmip6_esgf.py for those.

output_dir: data/cmip6

# France: North, West, South, East.
area: [55.0, -6.0, 41.0, 10.0]

years:
  start: 1960
  end: 2100

scenario: ssp370

models:
  - ipsl_cm6a_lr   # IPSL-CM6A-LR
  - cnrm_cm6_1     # CNRM-CM6-1
  - cesm2          # CESM2

# CMIP6 short names (mapped to CDS long names in the CDS script).
variables:
  - tas
  - pr
  - sfcWind
  - sfcWindmax
  - psl
  - rsds

members:
  ipsl_cm6a_lr: r1i1p1f1
  cnrm_cm6_1: r1i1p1f2
  cesm2: r1i1p1f1

# Known GCM gaps at daily resolution (report as warnings, not failures).
ignore_missing:
  - "cnrm_cm6_1:sfcWind:ssp370"
  - "cesm2:sfcWindmax:historical"
  - "cesm2:sfcWindmax:ssp370"